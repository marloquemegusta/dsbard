<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS Stylophone · Kanban</title>
  <style>
    :root { --bg:#10131a; --panel:#191e28; --card:#232a36; --ink:#f3f5f7; --muted:#aab3c2; --line:#354052; --accent:#7dd3fc; --good:#86efac; --warn:#fde68a; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at top left,#1d2b42,var(--bg) 42%); font:15px/1.45 system-ui,sans-serif; }
    header { max-width:1500px; margin:auto; padding:28px 24px 18px; display:flex; justify-content:space-between; gap:20px; align-items:end; }
    h1 { margin:0; font-size:clamp(24px,4vw,40px); letter-spacing:-.04em; } h1 span { color:var(--accent); } p { color:var(--muted); margin:.45rem 0 0; }
    button { border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#202735; padding:9px 13px; cursor:pointer; font:inherit; } button:hover { border-color:var(--accent); } .primary { color:#07131d; background:var(--accent); border-color:var(--accent); font-weight:700; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; } .board { max-width:1500px; margin:auto; padding:0 24px 28px; display:grid; grid-template-columns:repeat(5,minmax(210px,1fr)); gap:13px; overflow:auto; }
    .column { min-height:430px; background:rgba(25,30,40,.88); border:1px solid var(--line); border-radius:14px; padding:12px; } .column.over { outline:2px solid var(--accent); background:#1c2c3b; }
    .column-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px; } .column h2 { margin:0; font-size:16px; } .count { color:var(--muted); font-size:12px; } .wip { color:var(--warn); font-size:11px; }
    .cards { min-height:370px; } .card { background:var(--card); border:1px solid #3a4658; border-radius:11px; padding:12px; margin-bottom:10px; cursor:grab; box-shadow:0 5px 18px #0002; } .card:active { cursor:grabbing; } .card h3 { margin:0 0 6px; font-size:15px; } .card p { font-size:13px; margin:0 0 9px; } .meta { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; gap:6px; } .tag { color:var(--accent); }
    dialog { width:min(680px,calc(100% - 28px)); border:1px solid var(--line); border-radius:14px; padding:0; color:var(--ink); background:var(--panel); } dialog::backdrop { background:#0009; } form { padding:20px; } label { display:block; color:var(--muted); font-size:13px; margin:12px 0 5px; } input, textarea, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px; color:var(--ink); background:#10151d; font:inherit; } textarea { min-height:75px; resize:vertical; } .form-actions { display:flex; justify-content:space-between; gap:8px; margin-top:18px; } .right { display:flex; gap:8px; } .hint { max-width:1500px; margin:0 auto; padding:0 24px 20px; color:var(--muted); font-size:12px; }
    @media (max-width:900px) { header { align-items:start; flex-direction:column; } .toolbar { justify-content:flex-start; } .board { grid-template-columns:repeat(5,260px); } }
  </style>
</head>
<body>
  <header><div><h1>DS Stylophone <span>·</span> Kanban</h1><p>Una tarjeta = una entrega comprobable. Arrastra para cambiar de estado.</p></div><div class="toolbar"><button class="primary" id="new">+ Nueva tarjeta</button><button id="export">Exportar Markdown</button><button id="reset">Restaurar inicial</button></div></header>
  <main class="board" id="board"></main>
  <div class="hint">Los cambios se guardan automáticamente en este navegador. Exporta Markdown al terminar una sesión para sincronizar el estado versionado que consultará el agente.</div>
  <dialog id="editor"><form method="dialog"><h2 id="dialog-title">Nueva tarjeta</h2><input type="hidden" id="id"><label for="title">Título</label><input id="title" required maxlength="100"><label for="description">Descripción</label><textarea id="description" required></textarea><label for="criteria">Criterio de terminado / evidencia</label><textarea id="criteria" placeholder="Qué debe comprobarse para pasar a Hecho"></textarea><label for="tags">Etiquetas</label><input id="tags" placeholder="audio, ux, bug"><label for="column">Columna</label><select id="column"></select><div class="form-actions"><button type="button" id="delete">Eliminar</button><div class="right"><button value="cancel">Cancelar</button><button class="primary" value="save">Guardar</button></div></div></form></dialog>
  <script>
    const columns = [{id:'inbox',name:'Inbox',wip:''},{id:'todo',name:'Todo',wip:''},{id:'doing',name:'En curso',wip:'WIP 2'},{id:'review',name:'Revisión',wip:'WIP 3'},{id:'done',name:'Hecho',wip:''}];
    const initial = [
      {id:'K-001',title:'Validación auditiva formal y DSi XL',description:'Comprobar audio con una prueba repetible y validar la ROM en hardware físico.',criteria:'Evidencia explícita de ambas pruebas; actualizar STATUS.md y KNOWN_ISSUES.md.',tags:'audio, hardware',column:'todo'},
      {id:'K-002',title:'Guardar sesiones entre ejecuciones',description:'Definir si el instrumento debe persistir canciones, frases o diario al salir.',criteria:'Decisión documentada; si se implementa, pruebas de compatibilidad y recuperación.',tags:'producto, looper',column:'inbox'},
      {id:'K-003',title:'Revisar ideas de UX del instrumento',description:'Recoger mejoras de controles, ayuda y feedback sin romper la interfaz de 12 zonas.',criteria:'Lista priorizada con alcance y criterio de aceptación por idea.',tags:'ux',column:'inbox'},
      {id:'K-007',title:'Sustain: separar duración grabada y cola de reproducción',description:'Registrar el fin real de la pulsación aunque L mantenga una cola y reproducir esa cola sin alargar la nota grabada.',criteria:'Pruebas host y build correctos; captura con L separa fin de pulsación y cola SUS; actualizar estado y manual.',tags:'bug, audio, grabación',column:'review'},
      {id:'K-008',title:'Y: decidir loop al soltar tras comprobar navegación',description:'Posponer la conmutación de loop hasta soltar Y; izquierda/derecha y ajuste de frases consumen la pulsación.',criteria:'Prueba de lógica para soltar Y sin acción y navegar mientras se mantiene; build y documentación correctos.',tags:'bug, ux, looper',column:'done'},
      {id:'K-009',title:'Playhead verde en la preview de recorte',description:'Mostrar una barra verde que avance sobre el gráfico inferior mientras START reproduce el rango recortado.',criteria:'La barra sigue el tiempo de preview dentro de START..END, desaparece al detener y la documentación queda actualizada.',tags:'feature, ux, grabación',column:'review'},
      {id:'K-010',title:'Timeline táctil, pulso y corrección rítmica mínima',description:`Fricción observada: al repetir muchas veces una base no se puede volver inmediatamente al comienzo útil; LOOP 1 repite las tres copias de una captura x3 porque la UI muestra tres cajas pero el transporte cuenta una Phrase lógica; y el intérprete comete errores grandes de duración o posición que un autoajuste no puede interpretar.

Objetivo de producto: sustituir el selector LOOP N por una selección temporal directa y reutilizar una sola rejilla de pulso para transporte, referencias visuales y corrección manual. PULSE es solo un reloj interno: el metrónomo audible queda desactivado. Debe seguir sintiéndose como un instrumento: tocar normalmente no exige tempo, compás, proyecto ni editor.

Dos conceptos públicos, no más:
1. SELECT / selector de frases: una acción mantenida intercambia las pantallas y lleva las cajas de las tres pistas a la pantalla táctil. Tocar una caja abre el editor de aceptación de esa frase; no es un editor global.
2. PULSE GRID: duración del pulso y subdivisión fija de 4 pasos por pulso. No añadir todavía compás, acentos ternarios/cuaternarios ni nombres de notas; las capturas recién grabadas sí redondean inicio y duración al cuarto de pulso.

Modelo mínimo:
- TimelineSelection { cursor_ms, range_start_ms, range_end_ms, explicit_range }.
- loop_enabled sigue siendo independiente. El rango siempre gobierna el transporte: con loop vuelve a range_start; sin loop se detiene en range_end.
- Sin rango explícito, usar 0..song_duration. El rango es global para que las tres pistas sigan sincronizadas, aunque sus límites se elijan sobre la pista seleccionada.
- PulseGrid debe convertir sin deriva entre step e instante usando aritmética racional: time(step) = step * pulse_ms / 4. No acumular pulse_ms / 4 repetidamente.

Pack A, obligatorio primero — timeline táctil y transporte:
- Elegir una acción de un solo botón libre o recolocar de forma explícita una función secundaria existente; no introducir un acorde nuevo. Documentar la elección en MANUAL.md.
- En el selector de frases: tocar una caja concreta abre una copia editable de esa frase en el editor de aceptación. No mostrar playhead ni rango global.
- Ajuste híbrido de límites: antes de existir pulso, snap al borde de caja de repetición más cercano; con PulseGrid, snap a cuartos de pulso, dando prioridad a un borde de caja cercano. Una captura x3 expone tres cajas seleccionables aunque internamente siga siendo una Phrase con repeat_count=3.
- Y solo conmuta LOOP ON/OFF. Eliminar la interacción y el texto público LOOP N/loop_phrase_count; no es necesario cambiar el almacenamiento de Phrase ni desduplicar eventos para resolverlo.
- START reproduce/pausa. Si estaba detenido al final, reinicia en range_start. Cambiar o buscar el cursor no debe apagar el loop ni alterar el rango.
- Extraer lógica host-testable en include/loop_logic.h: normalización/clamp del rango, final de transporte con y sin loop, búsqueda de bordes de cada repetición expandida y snap. Evitar dejar la semántica enterrada únicamente en main.cpp.

Pack B — pulso compartido:
- Añadir un valor de pulso configurable antes de grabar con una interacción pequeña y visible; mostrar primero el concepto cotidiano (por ejemplo PULSO 1.00 s), no teoría obligatoria. Conservar un valor por defecto razonable y permitir tocar/grabar sin configurarlo.
- Durante grabación, PULSE solo mantiene la rejilla y el reloj interno; no emitir clic de metrónomo ni guardarlo como NoteEvent.
- Dibujar marcas de pulso y marcas menores de cuarto de pulso en el timeline enfocado. Las marcas y el clic deben derivarse del mismo PulseGrid y del mismo origen temporal.
- No añadir todavía compás ni distinguir ternario/cuaternario: solo serían necesarios para acentos o agrupaciones, no para corregir estas fricciones.

Pack C — corrección manual de la captura recién grabada:
- Ampliar la pantalla de aceptación para usar la superficie táctil disponible; no intentar meter la edición nota a nota en la franja actual de 32 px.
- Representar cada NoteEvent monofónico como un bloque horizontal. Seleccionar por toque y ofrecer targets cómodos para tres operaciones: mover el bloque, cambiar START y cambiar END, siempre en pasos de 1/4 de pulso.
- Al cerrar la captura, redondear automáticamente cada inicio y duración al cuarto de pulso más cercano, con duración mínima de un cuarto; después, al editar un borde, partir del paso de rejilla más cercano y conservar los bordes no tocados.
- Mantener silencios como huecos; no hacer ripple automático sobre eventos posteriores. Impedir duración cero, salida del rango y solapamientos entre notas adyacentes. No modificar pitch, instrument_id ni sustain_on_release.
- START alterna preview desde el inicio del rango editado; A acepta; B descarta y recupera exactamente la captura sin editar. Arriba/abajo conserva el ajuste de repeticiones o se sustituye por controles táctiles claramente documentados.
- Reutilizar build_trim_preview/accept_trim y el mismo PulseGrid; no crear otro formato persistente ni otro motor de playback.

Pack D, solo después de validar A-C — frases anteriores:
- Desde SELECT mantenido, tocar una caja abre el mismo editor de aceptación sobre una frase ya aceptada. A reemplaza la fuente; B cancela. No crear un segundo editor.
- Para repeat_count mayor que 1, editar la fuente y reflejar el cambio en todas sus repeticiones. Editar una copia aislada queda fuera.

Fuera de alcance: secuenciador general, piano roll por alturas, mover pitch, overdub, persistencia, zoom complejo, compás, cuantización automática global, edición simultánea de varias frases o rediseño de las 12 zonas táctiles.

Orden para el agente: leer AGENTS.md, STATUS.md, KNOWN_ISSUES.md, MANUAL.md, include/loop_logic.h y las zonas relevantes de source/main.cpp; mover K-010 a En curso antes de editar; implementar y verificar A, después B, después C. No iniciar D sin que A-C estén completas y comprobables. Si una decisión perceptible no queda fijada aquí, detenerse y preguntar en vez de inventarla.`,criteria:`Evidencia mínima para Revisión:
1. Tests host C++ nuevos cubren rango normal/invertido, clamp a canción, seek, reinicio, loop con overshoot, parada sin loop, bordes expandidos de x3 y conversión step-tiempo sin deriva; tests existentes siguen pasando.
2. Caso de regresión obligatorio: una Phrase de 1 s con repeat_count=3 dibuja tres cajas; seleccionar la tercera produce rango 2 s..3 s; LOOP ON repite solo ese segundo; LOOP OFF se detiene en 3 s; START vuelve a 2 s.
3. Caso global: con tres pistas de distinta duración, el mismo range_start/range_end gobierna las tres sin reinicios independientes ni desincronización.
4. Caso de edición: una nota demasiado larga se acorta manualmente varios cuartos de pulso; otra se desplaza; los eventos vecinos no se solapan; preview y aceptación conservan pitch, timbre y sustain; cancelar conserva los tiempos originales.
5. Instrumentación temporal de depuración: añadir DS_TRACE compactas para FOCUS, SEEK, RANGE, WRAP/STOP, GRID y NOTE_EDIT con tiempos absolutos y resultado. Retirarlas o dejarlas bajo DS_DEBUG_TRACE; no mostrar diagnósticos técnicos en la UI final.
6. Ejecutar python tests/test_loop_logic.py, compilar/ejecutar tests/test_loop_logic.cpp, build.ps1 y tools/run-looper-flow.ps1 hasta LOOPER_FLOW_RESULT=PASS.
7. Validación manual en la ROM: mantener SELECT, tocar una frase de cada pista, abrir el editor común, mover una nota, cambiar START/END, cancelar con B y aceptar con A; no declarar validación física de DSi sin prueba explícita.
8. Actualizar MANUAL.md por cada control o estado visible, STATUS.md al terminar y KNOWN_ISSUES.md solo si queda un problema real. Mover a Revisión, no a Hecho, hasta la validación del usuario en hardware.

Diagnóstico si falla:
- Si LOOP 1 o la selección repite x3 completo, inspeccionar la expansión visual Phrase.start_ms + repetition * duration_ms; no usar phrase_count como número de cajas.
- Si el playhead salta o deriva, registrar transport_ms, range_start, range_end y overshoot; aplicar módulo sobre el span conservando overshoot.
- Si la rejilla deriva, comprobar origen y time(step) comunes; no mantener dos acumuladores ni reactivar un clic audible.
- Si una edición altera otra nota, comparar copia original y editable evento por evento y verificar clamps con anterior.end_ms y siguiente.start_ms.
- Si la UI parece correcta pero el comportamiento no, validar primero helpers host-side y después recoger una traza o escenario pertinente según AGENTS.md; no abrir emuladores como smoke genérico.`,tags:'feature, ux, looper, ritmo, grabación',column:'todo'}
    ];
    const key='ds-stylophone-kanban-v1'; const initialK010=initial.find(c=>c.id==='K-010'); if(initialK010) initialK010.column='doing'; let cards=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(initial); const k010=cards.find(c=>c.id==='K-010'); if(k010){k010.column='doing';persist();} let dragged=null;
    const $=id=>document.getElementById(id); function persist(){localStorage.setItem(key,JSON.stringify(cards));}
    function render(){ $('board').innerHTML=''; columns.forEach(col=>{const el=document.createElement('section'); el.className='column'; el.dataset.column=col.id; el.innerHTML=`<div class="column-head"><h2>${col.name}</h2><span><span class="count"></span> <span class="wip">${col.wip}</span></span></div><div class="cards"></div>`; const list=el.querySelector('.cards'); const items=cards.filter(c=>c.column===col.id); el.querySelector('.count').textContent=items.length; items.forEach(card=>{const a=document.createElement('article'); a.className='card'; a.draggable=true; a.dataset.id=card.id; a.innerHTML=`<h3>${esc(card.title)}</h3><p>${esc(card.description)}</p><div class="meta"><span>${esc(card.id)} · <span class="tag">${esc(card.tags||'sin etiqueta')}</span></span><span>editar</span></div>`; a.onclick=()=>openEditor(card); a.ondragstart=e=>{dragged=card.id;e.stopPropagation()}; a.ondragend=()=>dragged=null; list.append(a)}); el.ondragover=e=>{e.preventDefault();el.classList.add('over')}; el.ondragleave=()=>el.classList.remove('over'); el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const c=cards.find(x=>x.id===dragged);if(c){c.column=col.id;persist();render()}}; $('board').append(el)}); }
    function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function openEditor(c){$('dialog-title').textContent=c?'Editar tarjeta':'Nueva tarjeta';$('id').value=c?.id||'';$('title').value=c?.title||'';$('description').value=c?.description||'';$('criteria').value=c?.criteria||'';$('tags').value=c?.tags||'';$('column').innerHTML=columns.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('column').value=c?.column||'inbox';$('delete').style.visibility=c?'visible':'hidden';$('editor').showModal()}
    $('new').onclick=()=>openEditor(); $('delete').onclick=()=>{const id=$('id').value;cards=cards.filter(c=>c.id!==id);persist();$('editor').close();render()}; $('editor').onsubmit=e=>{e.preventDefault();const id=$('id').value||`K-${String(Math.max(0,...cards.map(c=>Number(c.id.slice(2))||0))+1).padStart(3,'0')}`;const card={id,title:$('title').value.trim(),description:$('description').value.trim(),criteria:$('criteria').value.trim(),tags:$('tags').value.trim(),column:$('column').value};const i=cards.findIndex(c=>c.id===id);i<0?cards.push(card):cards[i]=card;persist();$('editor').close();render()}; $('reset').onclick=()=>{if(confirm('¿Restaurar las tarjetas iniciales? Se perderán los cambios locales.')){cards=structuredClone(initial);persist();render()}};
    $('export').onclick=()=>{const md=['# Kanban de features — DS Stylophone / Looper','','Actualizado desde `KANBAN.html`. Mover una tarjeta cambia su estado; añadir evidencia en la descripción o criterio.',''];columns.forEach(col=>{md.push(`## ${col.name}`,'');cards.filter(c=>c.column===col.id).forEach(c=>md.push(`- **${c.id} — ${c.title}** [${c.tags||'sin etiqueta'}]`,`  - ${c.description}`,`  - Terminado: ${c.criteria||'Por definir'}`,'') );});const blob=new Blob([md.join('\n')],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KANBAN.md';a.click();URL.revokeObjectURL(a.href)}; render();
  </script>
</body>
</html>
